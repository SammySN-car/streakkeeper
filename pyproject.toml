[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streakkeeper"
version = "0.1.0"
description = "One small, real documentation improvement per night, so a contribution streak survives busy days."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
streakkeeper = "streakkeeper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]